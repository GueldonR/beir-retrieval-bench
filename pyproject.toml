[project]
name = "examensarbete"
version = "0.1.0"
description = "BEIR retrieval benchmark comparing dense, HyDE, HyPE, and hybrid search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beir>=2.2.0",
    "matplotlib>=3.10.0",
    "openai>=1.82.0",
    "pytrec-eval-terrier>=0.5.10",
    "python-dotenv>=1.1.0",
    "qdrant-client>=1.17.0",
    "scipy>=1.15.0",
    "transformers>=5.2.0",
    "typing_extensions>=4.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
