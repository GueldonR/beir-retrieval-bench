services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - "6333"
      - "6334"
      - "6335"
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage

  vllm:
    image: vllm/vllm-openai:nightly
    container_name: vllm-server
    depends_on:
      qwen3-embedding-vllm:
        condition: service_healthy
    ports:
      - "8100:8000"
    ipc: host
    volumes:
      - ${HF_CACHE_DIR:-./data/hub}:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen3.5-0.8B
      --enable-prefix-caching
      --enable-chunked-prefill
      --max-model-len 2000
      --max-num-seqs 256
      --gpu-memory-utilization 0.30
      --language-model-only

  qwen3-embedding-vllm:
    image: vllm/vllm-openai:nightly
    container_name: qwen3-embedding-vllm
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    ports:
      - "12434:8000"
    volumes:
      - ${HF_CACHE_DIR:-./data/hub}:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen3-Embedding-0.6B
      --max-model-len 1024
      --gpu-memory-utilization 0.30

configs:
  qdrant_config:
    content: |
      log_level: INFO