services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - "6333"
      - "6334"
      - "6335"
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage

  vllm:
    image: vllm/vllm-openai:nightly
    container_name: vllm-server
    depends_on:
      qwen3-embedding-vllm:
        condition: service_healthy
    ports:
      - "8100:8000"
    ipc: host
    volumes:
      - ${HF_CACHE_DIR:-./data/hub}:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen3.5-0.8B
      --enable-prefix-caching
      --enable-chunked-prefill
      --max-model-len 2000
      --max-num-seqs 256
      --gpu-memory-utilization 0.30
      --language-model-only

  qwen3-embedding-vllm:
    image: vllm/vllm-openai:nightly
    container_name: qwen3-embedding-vllm
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    ports:
      - "12434:8000"
    volumes:
      - ${HF_CACHE_DIR:-./data/hub}:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen3-Embedding-0.6B
      --max-model-len 1024
      --gpu-memory-utilization 0.30

  eval: &python-job
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - eval_venv:/venv
      - uv_cache:/root/.cache/uv
    env_file: .env
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy # the cache and /app are on different volumes
      HF_HOME: /app/data/hub
      PYTHONUNBUFFERED: 1 # print() shows up live, even without a terminal attached
      # Inside the compose network: service name + container port, not localhost.
      QDRANT_URL: http://qdrant:6333
      VLLM_URL: http://vllm:8000/v1
      EMBEDDING_URL: http://qwen3-embedding-vllm:8000/v1
    depends_on:
      - qdrant
    profiles: [tools]
    command: uv run python -m src.beir_test

  setup:
    <<: *python-job
    command: uv run python -m src.setup_infra

volumes:
  eval_venv:
  uv_cache:

configs:
  qdrant_config:
    content: |
      log_level: INFO
