services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - "6333"
      - "6334"
      - "6335"
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage

  vllm:
    image: vllm/vllm-openai:nightly
    container_name: vllm-server
    ports:
      - "8100:8000"
    ipc: host
    volumes:
      - ${HF_CACHE_DIR:-./data/hub}:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen3.5-9B
      --enable-prefix-caching
      --enable-chunked-prefill
      --max-model-len 2000
      --max-num-seqs 256
      --gpu-memory-utilization 0.9
      --language-model-only

  qwen3-embedding-vllm:
    image: vllm/vllm-openai:nightly
    container_name: qwen3-embedding-vllm
    ports:
      - "12434:8000"
    volumes:
      - ${HF_CACHE_DIR:-./data/hub}:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen3-Embedding-0.6B
      --max-model-len 1024
      --gpu-memory-utilization 0.1

configs:
  qdrant_config:
    content: |
      log_level: INFO